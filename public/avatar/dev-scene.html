<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentLife avatar test scene</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .stage {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        perspective: 420px;
      }
      .orb {
        width: 72%;
        height: 72%;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 28%,
          #dbeafe 0%,
          #3b82f6 46%,
          #1d4ed8 100%
        );
        box-shadow: inset -10px -12px 22px rgba(15, 23, 42, 0.28);
        transform-style: preserve-3d;
      }
      @media (prefers-reduced-motion: no-preference) {
        .orb {
          animation: spin 7s linear infinite;
        }
      }
      @keyframes spin {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" data-avatar-test-scene="ready">
      <div class="orb" aria-hidden="true"></div>
    </div>
  </body>
</html>
